# dsh-key-palette-b bundle patch
#
# This file is the `dsh.bundle.patch` layer of the package: when the plugin is
# installed through the official CLI —
#
#   dsh plugin --profile <name> add dsh-key-palette-b@<version>
#   dsh plugin --profile <name> add ./plugins/dsh-key-palette-b   (local checkout)
#
# — the command reconciles `dsh.profile.bundles` against installed packages
# and, seeing this declaration, appends `dsh-key-palette-b` to the bundle
# stack. The profile boot then merges THIS patch (a single `insert` of the
# plugin row) exactly like the manual cordis.patch.yml mount line used
# before. No profile file edits needed — one command installs and mounts.
#
# If the profile still carries the old manual mount line in its own
# cordis.patch.yml (the ./scripts/install.sh channel), remove it before
# switching to the bundle channel to avoid double-mounting (two Node halves,
# two palettes). Note: the bundle stack is composed at profile boot, so this
# channel takes effect on the next `dsh` start (no hot-apply).
- insert:
    - id: keys-palette
      name: 'dsh-key-palette-b'
